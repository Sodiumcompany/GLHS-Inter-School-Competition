<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · CompHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 20%, #1a0b2e 0%, #0d0518 50%, #1a0b2e 100%);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(2px 2px at 20% 30%, rgba(139, 92, 246, 0.5), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(236, 72, 153, 0.4), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(139, 92, 246, 0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(236, 72, 153, 0.5), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(139, 92, 246, 0.4), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(236, 72, 153, 0.3), transparent);
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            animation: sparkle 8s linear infinite;
        }

        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(20px, -20px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(236, 72, 153, 0.12);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.10);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, 20px) scale(1.05);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #A78BFA, #F472B6);
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 92%;
            max-width: 1280px;
            background: rgba(13, 5, 24, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .navbar.scrolled {
            top: 10px;
            padding: 8px 24px;
            background: rgba(13, 5, 24, 0.85);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-brand i {
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
            color: #8B5CF6;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(139, 92, 246, 0.20);
        }

        .nav-links a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.30), rgba(236, 72, 153, 0.25));
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.10);
        }

        .nav-links .logout-btn {
            background: rgba(239, 68, 68, 0.20);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.20);
        }

        .nav-links .logout-btn:hover {
            background: rgba(239, 68, 68, 0.30);
            color: #fff;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .page {
            display: block;
            padding: 100px 24px 60px;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== ADMIN SPECIFIC ===== */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 900;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-header .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .admin-header .admin-user i {
            font-size: 1.4rem;
            color: #8B5CF6;
        }

        /* Action Cards */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        @media (max-width: 600px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
        }

        .action-card {
            padding: 32px 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .action-card:hover {
            transform: translateY(-6px);
            border-color: rgba(139, 92, 246, 0.30);
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.12);
        }

        .action-card .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .action-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .action-card p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .action-card .badge-action {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(139, 92, 246, 0.15);
            color: #A78BFA;
            border: 1px solid rgba(139, 92, 246, 0.10);
        }

        .action-card.announcement-card .icon {
            background: linear-gradient(135deg, #8B5CF6, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .action-card.participant-card .icon {
            background: linear-gradient(135deg, #EC4899, #F472B6);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            max-width: 640px;
            width: 100%;
            padding: 36px 32px;
            background: rgba(13, 5, 24, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlide {
            from {
                transform: translateY(40px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h2 i {
            color: #8B5CF6;
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px 8px;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }

        .modal .form-group input,
        .modal .form-group textarea,
        .modal .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .modal .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal .form-group select option {
            background: #1a0b2e;
            color: #fff;
        }

        .modal .form-group input:focus,
        .modal .form-group textarea:focus,
        .modal .form-group select:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.10);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal .form-group input::placeholder,
        .modal .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Member fields */
        .member-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .member-group .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .member-group .member-header .member-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .member-group .member-remove {
            background: rgba(239, 68, 68, 0.15);
            border: none;
            color: #f87171;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .member-group .member-remove:hover {
            background: rgba(239, 68, 68, 0.30);
            color: #fff;
        }

        .member-group .member-fields {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .member-group .member-fields {
                grid-template-columns: 1fr 1fr;
            }
        }

        .member-group .member-fields .form-group {
            margin-bottom: 0;
        }

        .member-group .member-fields .form-group input,
        .member-group .member-fields .form-group select {
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .btn-add-member {
            background: rgba(139, 92, 246, 0.12);
            border: 1px dashed rgba(139, 92, 246, 0.25);
            color: #A78BFA;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            margin-top: 4px;
        }

        .btn-add-member:hover {
            background: rgba(139, 92, 246, 0.20);
            border-color: rgba(139, 92, 246, 0.40);
        }

        .btn-add-member:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal .form-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.20);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.10);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.30);
            color: #fff;
        }

        .btn-success {
            background: rgba(52, 211, 153, 0.20);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.10);
        }

        .btn-success:hover {
            background: rgba(52, 211, 153, 0.30);
            color: #fff;
        }

        .btn-pin {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.10);
        }

        .btn-pin:hover {
            background: rgba(251, 191, 36, 0.25);
            color: #fff;
        }

        .btn-pin.pinned {
            background: rgba(251, 191, 36, 0.25);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.25);
        }

        /* ===== COMPETITION SELECTOR ===== */
        .comp-selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .comp-selector-item {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
        }

        .comp-selector-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.20);
        }

        .comp-selector-item.active {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.30);
            color: #fff;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.05);
        }

        .comp-selector-item i {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== RECENT ENTRIES ===== */
        .entries-section {
            margin-top: 30px;
        }

        .entries-section .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .entries-section .section-title i {
            color: #8B5CF6;
        }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .entry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            gap: 12px;
            flex-wrap: wrap;
        }

        .entry-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .entry-item.pinned-entry {
            border-color: rgba(251, 191, 36, 0.20);
            background: rgba(251, 191, 36, 0.05);
        }

        .entry-item .entry-info {
            flex: 1;
            min-width: 120px;
        }

        .entry-item .entry-info .entry-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .entry-item .entry-info .entry-title .pin-badge {
            font-size: 0.6rem;
            background: rgba(251, 191, 36, 0.20);
            color: #fbbf24;
            padding: 1px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .entry-item .entry-info .entry-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .entry-item .entry-info .entry-members {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }

        .entry-item .entry-meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .entry-item .entry-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .entry-item .entry-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .entry-item .entry-actions .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .entry-item .entry-actions .delete-btn:hover {
            background: rgba(239, 68, 68, 0.30);
            color: #fff;
        }

        .entry-item .entry-actions .pin-btn {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
        }

        .entry-item .entry-actions .pin-btn:hover {
            background: rgba(251, 191, 36, 0.25);
            color: #fff;
        }

        .entry-item .entry-actions .pin-btn.is-pinned {
            background: rgba(251, 191, 36, 0.25);
            color: #fbbf24;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }

        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(13, 5, 24, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid #34d399;
        }
        .toast.error {
            border-left: 4px solid #f87171;
        }
        .toast.info {
            border-left: 4px solid #8B5CF6;
        }

        .toast i {
            font-size: 1.2rem;
        }
        .toast.success i {
            color: #34d399;
        }
        .toast.error i {
            color: #f87171;
        }
        .toast.info i {
            color: #8B5CF6;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-top: 2px solid #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .navbar {
                padding: 10px 18px;
                border-radius: 40px;
                width: 96%;
            }
            .nav-brand span {
                font-size: 0.9rem;
            }
            .nav-links a {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 768px) {
            .nav-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 16px 0 8px;
                gap: 4px;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links a {
                width: 100%;
                justify-content: center;
                padding: 10px;
                font-size: 0.9rem;
            }
            .page {
                padding: 90px 16px 40px;
            }
            .modal {
                padding: 28px 20px;
            }
            .comp-selector-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            .comp-selector-item {
                font-size: 0.7rem;
                padding: 10px 8px;
            }
            .comp-selector-item i {
                font-size: 1.2rem;
            }
            .member-group .member-fields {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
            .admin-header h1 {
                font-size: 1.4rem;
            }
            .admin-header .admin-user {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .modal .form-actions {
                flex-direction: column;
            }
            .member-group .member-fields {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-brand">
            <i class="fas fa-trophy"></i>
            <span>CompHub</span>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="admin.html" class="active"><i class="fas fa-crown"></i> Admin</a>
            <a href="#" id="logoutNavLink" class="logout-btn" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <!-- ===== ADMIN PAGE ===== -->
    <section class="page" id="page-admin">
        <div class="admin-header">
            <h1><i class="fas fa-crown" style="color:#8B5CF6; -webkit-text-fill-color:initial;"></i> Admin Dashboard</h1>
            <div class="admin-user">
                <i class="fas fa-user-circle"></i>
                <span id="adminUserEmail">Loading...</span>
            </div>
        </div>

        <!-- Action Cards -->
        <div class="action-grid">
            <div class="action-card announcement-card glass" onclick="openModal('announcement')">
                <span class="icon"><i class="fas fa-bullhorn"></i></span>
                <h3>📢 Announcement</h3>
                <p>Post updates, notices, or important information</p>
                <span class="badge-action"><i class="fas fa-plus"></i> Create New</span>
            </div>
            <div class="action-card participant-card glass" onclick="openModal('participant')">
                <span class="icon"><i class="fas fa-users"></i></span>
                <h3>👥 Participant</h3>
                <p>Add team/project with members & details</p>
                <span class="badge-action"><i class="fas fa-plus"></i> Add Participant</span>
            </div>
        </div>

        <!-- ===== RECENT ENTRIES ===== -->
        <div class="entries-section">
            <div class="section-title"><i class="fas fa-clock"></i> Recent Activity</div>
            <div id="recentEntries">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>
        </div>
    </section>

    <!-- ============================================================ -->
    <!--  MODAL: Announcement / Participant                           -->
    <!-- ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal glass" id="modalContent">
            <!-- Dynamic content rendered by JS -->
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <!-- ============================================================ -->
    <!--  FIREBASE SCRIPTS                                            -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="js/firebase-config.js">
    </script>

    <script>
        // ============================================================
        //  COMPETITIONS DATA
        // ============================================================
        const COMPETITIONS = [
            { id: 'video-edition', name: 'Video Edition', icon: 'fa-film' },
            { id: 'graphics-design', name: 'Graphics Designing', icon: 'fa-palette' },
            { id: 'ai-web-dev', name: 'Web Dev With AI', icon: 'fa-robot' },
            { id: 'ict-quiz', name: 'ICT Quiz', icon: 'fa-brain' },
            { id: 'speed-typing', name: 'Speed Typing', icon: 'fa-keyboard' },
            { id: 'storytelling', name: 'Story Telling Script', icon: 'fa-pen-fancy' },
            { id: 'presentation', name: 'Presentation Slide', icon: 'fa-presentation' },
            { id: 'ctf', name: 'Capture The Flag', icon: 'fa-flag' }
        ];

        // ============================================================
        //  TOAST HELPER
        // ============================================================
        let toastTimeout = null;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.className = 'toast ' + type;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.querySelector('i').className = 'fas ' + (icons[type] || icons.info);
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        //  AUTH
        // ============================================================
        function logoutUser(e) {
            if (e) e.preventDefault();
            auth.signOut().then(() => {
                showToast('Logged out successfully', 'success');
                window.location.href = 'index.html';
            }).catch(err => {
                showToast('Logout error: ' + err.message, 'error');
            });
        }

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('adminUserEmail').textContent = user.email || 'Admin';
            loadRecentEntries();
        });

        // ============================================================
        //  MODAL
        // ============================================================
        let modalType = 'announcement';
        let selectedCompId = null;
        let memberCount = 0;
        const MAX_MEMBERS = 3;

        function openModal(type) {
            modalType = type;
            selectedCompId = null;
            memberCount = 0;
            renderModal();
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function renderModal() {
            const container = document.getElementById('modalContent');

            const title = modalType === 'announcement' ?
                '<i class="fas fa-bullhorn"></i> New Announcement' :
                '<i class="fas fa-users"></i> Add Team / Participant';

            const compSelector = COMPETITIONS.map(c => `
                <div class="comp-selector-item ${selectedCompId === c.id ? 'active' : ''}" 
                     onclick="selectCompetition('${c.id}')">
                    <i class="fas ${c.icon}"></i>
                    ${c.name}
                </div>
            `).join('');

            let formFields = '';
            if (modalType === 'announcement') {
                formFields = `
                    <div class="form-group">
                        <label for="annTitle">Title</label>
                        <input type="text" id="annTitle" placeholder="Enter announcement title..." />
                    </div>
                    <div class="form-group">
                        <label for="annContent">Content</label>
                        <textarea id="annContent" placeholder="Write your announcement details..."></textarea>
                    </div>
                `;
            } else {
                // Participant form with project name, members, description
                const memberFields = getMemberFieldsHTML();
                formFields = `
                    <div class="form-group">
                        <label for="projectName">Project Name <span style="color:#f87171;">*</span></label>
                        <input type="text" id="projectName" placeholder="Enter project title..." />
                    </div>
                    <div class="form-group">
                        <label for="projectDesc">Description <span style="color:rgba(255,255,255,0.3);">(optional)</span></label>
                        <textarea id="projectDesc" placeholder="Brief description of the project..."></textarea>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label style="font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.7);display:block;margin-bottom:8px;">
                            <i class="fas fa-user-friends"></i> Team Members <span style="color:rgba(255,255,255,0.3);">(max ${MAX_MEMBERS})</span>
                        </label>
                        <div id="memberContainer">
                            ${memberFields}
                        </div>
                        <button type="button" class="btn-add-member" id="addMemberBtn" onclick="addMemberField()" ${memberCount >= MAX_MEMBERS ? 'disabled' : ''}>
                            <i class="fas fa-plus"></i> Add Member (${memberCount}/${MAX_MEMBERS})
                        </button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="modal-header">
                    <h2>${title}</h2>
                    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
                </div>

                <div style="margin-bottom:16px;">
                    <label style="font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.7);display:block;margin-bottom:8px;">
                        <i class="fas fa-tag"></i> Select Competition
                    </label>
                    <div class="comp-selector-grid">${compSelector}</div>
                    ${!selectedCompId ? '<div style="font-size:0.8rem;color:rgba(255,255,255,0.3);text-align:center;padding:4px;">Please select a competition above</div>' : ''}
                </div>

                <form id="modalForm" onsubmit="submitModal(event)">
                    ${formFields}
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn-primary" id="modalSubmitBtn">
                            ${modalType === 'announcement' ? '<i class="fas fa-paper-plane"></i> Post Announcement' : '<i class="fas fa-user-plus"></i> Add Participant'}
                        </button>
                    </div>
                </form>
            `;
        }

        function getMemberFieldsHTML() {
            // Generate member fields for existing members
            let html = '';
            for (let i = 0; i < memberCount; i++) {
                html += `
                    <div class="member-group" id="memberGroup_${i}">
                        <div class="member-header">
                            <span class="member-label"><i class="fas fa-user"></i> Member ${i + 1}</span>
                            ${memberCount > 1 ? `<button type="button" class="member-remove" onclick="removeMember(${i})"><i class="fas fa-times"></i> Remove</button>` : ''}
                        </div>
                        <div class="member-fields">
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" id="memberName_${i}" placeholder="Full name" />
                            </div>
                            <div class="form-group">
                                <label>Roll</label>
                                <input type="text" id="memberRoll_${i}" placeholder="Roll number" />
                            </div>
                            <div class="form-group">
                                <label>Class</label>
                                <select id="memberClass_${i}">
                                    <option value="">Select</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Section</label>
                                <select id="memberSection_${i}">
                                    <option value="">Select</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        function addMemberField() {
            if (memberCount >= MAX_MEMBERS) {
                showToast('Maximum ${MAX_MEMBERS} members allowed', 'error');
                return;
            }
            memberCount++;
            renderModal();
            // Re-attach the add button listener after re-render
            const addBtn = document.getElementById('addMemberBtn');
            if (addBtn) {
                addBtn.addEventListener('click', addMemberField);
            }
        }

        function removeMember(index) {
            if (memberCount <= 1) {
                showToast('At least one member is required', 'error');
                return;
            }
            // Remove the member group
            const group = document.getElementById(`memberGroup_${index}`);
            if (group) {
                group.remove();
                memberCount--;
                // Re-number the remaining groups
                const groups = document.querySelectorAll('.member-group');
                groups.forEach((g, i) => {
                    const label = g.querySelector('.member-label');
                    if (label) {
                        label.textContent = `Member ${i + 1}`;
                    }
                    // Update IDs of inputs inside
                    const inputs = g.querySelectorAll('input, select');
                    inputs.forEach(inp => {
                        const id = inp.id;
                        if (id) {
                            const parts = id.split('_');
                            if (parts.length === 2) {
                                inp.id = parts[0] + '_' + i;
                            }
                        }
                    });
                    // Update remove button
                    const removeBtn = g.querySelector('.member-remove');
                    if (removeBtn) {
                        removeBtn.onclick = function() { removeMember(i); };
                    }
                });
                // Update add button text
                const addBtn = document.getElementById('addMemberBtn');
                if (addBtn) {
                    addBtn.innerHTML = `<i class="fas fa-plus"></i> Add Member (${memberCount}/${MAX_MEMBERS})`;
                    addBtn.disabled = memberCount >= MAX_MEMBERS;
                }
            }
        }

        function selectCompetition(compId) {
            selectedCompId = compId;
            renderModal();
        }

        // ============================================================
        //  SUBMIT MODAL
        // ============================================================
        async function submitModal(e) {
            e.preventDefault();

            if (!selectedCompId) {
                showToast('Please select a competition first', 'error');
                return;
            }

            const submitBtn = document.getElementById('modalSubmitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Saving...';

            try {
                const docRef = db.collection('competitions').doc(selectedCompId);
                const doc = await docRef.get();
                const data = doc.exists ? doc.data() : { announcements: [], participants: [] };

                if (modalType === 'announcement') {
                    const title = document.getElementById('annTitle').value.trim();
                    const content = document.getElementById('annContent').value.trim();
                    if (!title || !content) {
                        showToast('Please fill in both title and content', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                        return;
                    }
                    const announcements = data.announcements || [];
                    announcements.push({
                        title,
                        content,
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric',
                            year: 'numeric' }),
                        pinned: false,
                        timestamp: Date.now()
                    });
                    await docRef.set({ announcements }, { merge: true });
                    showToast('✅ Announcement posted successfully!', 'success');
                } else {
                    // Participant / Team
                    const projectName = document.getElementById('projectName').value.trim();
                    const description = document.getElementById('projectDesc').value.trim();

                    if (!projectName) {
                        showToast('Please enter a project name', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                        return;
                    }

                    // Collect members
                    const members = [];
                    for (let i = 0; i < memberCount; i++) {
                        const name = document.getElementById(`memberName_${i}`).value.trim();
                        const roll = document.getElementById(`memberRoll_${i}`).value.trim();
                        const cls = document.getElementById(`memberClass_${i}`).value;
                        const section = document.getElementById(`memberSection_${i}`).value;

                        if (!name) {
                            showToast(`Please enter name for member ${i + 1}`, 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                            return;
                        }
                        if (!roll) {
                            showToast(`Please enter roll for member ${i + 1}`, 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                            return;
                        }
                        if (!cls) {
                            showToast(`Please select class for member ${i + 1}`, 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                            return;
                        }
                        if (!section) {
                            showToast(`Please select section for member ${i + 1}`, 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                            return;
                        }

                        members.push({ name, roll, class: cls, section });
                    }

                    const participants = data.participants || [];
                    participants.push({
                        projectName,
                        description: description || '',
                        members,
                        memberCount: members.length,
                        timestamp: Date.now()
                    });
                    await docRef.set({ participants }, { merge: true });
                    showToast('✅ Participant added successfully!', 'success');
                }

                closeModal();
                loadRecentEntries();

            } catch (err) {
                console.error('Submit error:', err);
                showToast('Error: ' + err.message, 'error');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }

        // ============================================================
        //  LOAD RECENT ENTRIES
        // ============================================================
        async function loadRecentEntries() {
            const container = document.getElementById('recentEntries');
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

            try {
                const allEntries = [];

                for (const comp of COMPETITIONS) {
                    const doc = await db.collection('competitions').doc(comp.id).get();
                    if (doc.exists) {
                        const data = doc.data();

                        // Announcements
                        if (data.announcements) {
                            data.announcements.forEach((a, idx) => {
                                allEntries.push({
                                    type: 'announcement',
                                    compName: comp.name,
                                    compId: comp.id,
                                    index: idx,
                                    title: a.title || 'Untitled',
                                    content: a.content || '',
                                    date: a.date || 'N/A',
                                    pinned: a.pinned || false,
                                    timestamp: a.timestamp || 0,
                                    raw: a
                                });
                            });
                        }

                        // Participants
                        if (data.participants) {
                            data.participants.forEach((p, idx) => {
                                const memberNames = (p.members || []).map(m => m.name).join(', ');
                                allEntries.push({
                                    type: 'participant',
                                    compName: comp.name,
                                    compId: comp.id,
                                    index: idx,
                                    projectName: p.projectName || 'Untitled Project',
                                    description: p.description || '',
                                    members: p.members || [],
                                    memberCount: p.members ? p.members.length : 0,
                                    memberNames: memberNames || 'No members',
                                    timestamp: p.timestamp || 0,
                                    raw: p
                                });
                            });
                        }
                    }
                }

                // Sort by timestamp (newest first)
                allEntries.sort((a, b) => {
                    const ta = a.timestamp || 0;
                    const tb = b.timestamp || 0;
                    return tb - ta;
                });

                // Pinned announcements come first (after sorting by time, we re-order)
                const pinned = allEntries.filter(e => e.type === 'announcement' && e.pinned);
                const unpinned = allEntries.filter(e => !(e.type === 'announcement' && e.pinned));
                const sorted = [...pinned, ...unpinned];

                const recent = sorted.slice(0, 15);

                if (recent.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            No announcements or participants yet.<br>
                            Start by posting your first update!
                        </div>
                    `;
                    return;
                }

                container.innerHTML = recent.map(entry => {
                    const isAnn = entry.type === 'announcement';
                    const isPinned = isAnn && entry.pinned;

                    let titleText = isAnn ? entry.title : entry.projectName;
                    let subText = isAnn ? entry.content : `👥 ${entry.memberCount} members: ${entry.memberNames}`;
                    let badge = isAnn ? '📢 Announcement' : '👤 Participant';
                    let dateDisplay = entry.date && entry.date !== 'N/A' ? entry.date : 'Just now';
                    let icon = isAnn ? 'fa-bullhorn' : 'fa-users';
                    let color = isAnn ? '#8B5CF6' : '#EC4899';

                    const pinBadge = isPinned ?
                        `<span class="pin-badge"><i class="fas fa-thumbtack"></i> Pinned</span>` :
                        '';

                    const compBadge =
                        `<span style="background:rgba(139,92,246,0.12);padding:2px 10px;border-radius:12px;font-size:0.65rem;color:#A78BFA;">${entry.compName}</span>`;

                    let actions = '';
                    if (isAnn) {
                        actions = `
                            <button class="pin-btn ${isPinned ? 'is-pinned' : ''}" onclick="togglePin('${entry.compId}', ${entry.index}, ${!isPinned})">
                                <i class="fas ${isPinned ? 'fa-thumbtack' : 'fa-thumbtack'}"></i> ${isPinned ? 'Unpin' : 'Pin'}
                            </button>
                            <button class="delete-btn" onclick="deleteEntry('${entry.compId}', 'announcement', ${entry.index})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        `;
                    } else {
                        actions = `
                            <button class="delete-btn" onclick="deleteEntry('${entry.compId}', 'participant', ${entry.index})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        `;
                    }

                    // Show member details in sub text for participants
                    let memberDetails = '';
                    if (!isAnn && entry.members && entry.members.length > 0) {
                        const memberList = entry.members.map(m =>
                            `${m.name} (Roll: ${m.roll}, Class ${m.class}-${m.section})`
                        ).join(' · ');
                        memberDetails =
                            `<div class="entry-members"><i class="fas fa-users"></i> ${memberList}</div>`;
                    }

                    return `
                        <div class="entry-item ${isPinned ? 'pinned-entry' : ''}">
                            <div class="entry-info">
                                <div class="entry-title">
                                    <i class="fas ${icon}" style="color:${color};margin-right:6px;"></i>
                                    ${titleText}
                                    ${pinBadge}
                                </div>
                                <div class="entry-sub">${subText}</div>
                                ${memberDetails}
                                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
                                    <span style="font-size:0.65rem;color:rgba(255,255,255,0.3);padding:2px 8px;background:rgba(255,255,255,0.04);border-radius:10px;">${badge}</span>
                                    ${compBadge}
                                    <span class="entry-meta"><i class="far fa-clock"></i> ${dateDisplay}</span>
                                </div>
                            </div>
                            <div class="entry-actions">
                                ${actions}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Load entries error:', err);
                container.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Failed to load: ${err.message}</div>`;
            }
        }

        // ============================================================
        //  DELETE ENTRY
        // ============================================================
        async function deleteEntry(compId, type, index) {
            if (!confirm(`Delete this ${type}? This action cannot be undone.`)) return;

            try {
                const docRef = db.collection('competitions').doc(compId);
                const doc = await docRef.get();
                const data = doc.exists ? doc.data() : {};

                const key = type === 'announcement' ? 'announcements' : 'participants';
                const items = data[key] || [];

                if (index >= 0 && index < items.length) {
                    items.splice(index, 1);
                    await docRef.set({ [key]: items }, { merge: true });
                    showToast(`✅ ${type.charAt(0).toUpperCase() + type.slice(1)} deleted successfully!`, 'success');
                    loadRecentEntries();
                } else {
                    showToast('Item not found', 'error');
                }
            } catch (err) {
                console.error('Delete error:', err);
                showToast('Error: ' + err.message, 'error');
            }
        }

        // ============================================================
        //  TOGGLE PIN
        // ============================================================
        async function togglePin(compId, index, pinState) {
            try {
                const docRef = db.collection('competitions').doc(compId);
                const doc = await docRef.get();
                const data = doc.exists ? doc.data() : {};
                const announcements = data.announcements || [];

                if (index >= 0 && index < announcements.length) {
                    announcements[index].pinned = pinState;
                    await docRef.set({ announcements }, { merge: true });
                    showToast(pinState ? '📌 Announcement pinned!' : '📍 Announcement unpinned', 'success');
                    loadRecentEntries();
                } else {
                    showToast('Announcement not found', 'error');
                }
            } catch (err) {
                console.error('Pin error:', err);
                showToast('Error: ' + err.message, 'error');
            }
        }

        // ============================================================
        //  NAVBAR SCROLL / TOGGLE
        // ============================================================
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('open');
        });
    </script>

</body>
</html>
