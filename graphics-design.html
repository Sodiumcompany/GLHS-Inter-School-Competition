<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphics Designing · CompHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 20%, #1a0b2e 0%, #0d0518 50%, #1a0b2e 100%);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(2px 2px at 20% 30%, rgba(139, 92, 246, 0.5), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(236, 72, 153, 0.4), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(139, 92, 246, 0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(236, 72, 153, 0.5), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(139, 92, 246, 0.4), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(236, 72, 153, 0.3), transparent);
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            animation: sparkle 8s linear infinite;
        }
        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(20px, -20px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(236, 72, 153, 0.12);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.10);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, 20px) scale(1.05);
            }
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #A78BFA, #F472B6);
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 92%;
            max-width: 1280px;
            background: rgba(13, 5, 24, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .navbar.scrolled {
            top: 10px;
            padding: 8px 24px;
            background: rgba(13, 5, 24, 0.85);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .nav-brand i {
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
            color: #8B5CF6;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            color: #fff;
            background: rgba(139, 92, 246, 0.20);
        }
        .nav-links a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.30), rgba(236, 72, 153, 0.25));
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.10);
        }
        .nav-links .login-btn {
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.30);
            transition: all 0.3s ease;
        }
        .nav-links .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.40);
            background: linear-gradient(135deg, #A78BFA, #F472B6);
        }
        .nav-links .logout-btn {
            background: rgba(239, 68, 68, 0.20);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.20);
        }
        .nav-links .logout-btn:hover {
            background: rgba(239, 68, 68, 0.30);
            color: #fff;
        }
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .page {
            display: block;
            padding: 100px 24px 60px;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .comp-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .comp-header .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .comp-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
            transform: translateX(-4px);
        }
        .comp-logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.20), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(139, 92, 246, 0.20);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #8B5CF6;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .comp-logo:hover {
            transform: scale(1.05) rotate(-2deg);
            border-color: rgba(139, 92, 246, 0.40);
            box-shadow: 0 12px 48px rgba(139, 92, 246, 0.25);
        }
        .comp-logo svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #8B5CF6;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .comp-header h1 {
            font-size: clamp(1.6rem, 3vw, 2.6rem);
            font-weight: 800;
            flex: 1;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .comp-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .comp-sections {
                grid-template-columns: 1fr;
            }
            .comp-logo {
                width: 48px;
                height: 48px;
                font-size: 1.5rem;
            }
            .comp-logo svg {
                width: 26px;
                height: 26px;
            }
            .participant-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
        .section-card {
            padding: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
        }
        .section-card .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .section-card .section-title i {
            color: #8B5CF6;
        }
        .announcement-item {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #8B5CF6;
            transition: all 0.3s ease;
        }
        .announcement-item:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateX(4px);
        }
        .announcement-item .title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }
        .announcement-item .date {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }
        .announcement-item .content {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            line-height: 1.5;
        }
        .participant-item {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #EC4899;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .participant-item:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateX(4px);
        }
        .participant-item .name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
        }
        .participant-item .school {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .participant-item .team-tag {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(236, 72, 153, 0.15);
            color: #F472B6;
            border: 1px solid rgba(236, 72, 153, 0.10);
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }
        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.4;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(13, 5, 24, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            border-left: 4px solid #34d399;
        }
        .toast.error {
            border-left: 4px solid #f87171;
        }
        .toast.info {
            border-left: 4px solid #8B5CF6;
        }
        .toast i {
            font-size: 1.2rem;
        }
        .toast.success i {
            color: #34d399;
        }
        .toast.error i {
            color: #f87171;
        }
        .toast.info i {
            color: #8B5CF6;
        }
        @media (max-width: 992px) {
            .navbar {
                padding: 10px 18px;
                border-radius: 40px;
                width: 96%;
            }
            .nav-brand span {
                font-size: 0.9rem;
            }
            .nav-links a {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }
        @media (max-width: 768px) {
            .nav-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 16px 0 8px;
                gap: 4px;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links a {
                width: 100%;
                justify-content: center;
                padding: 10px;
                font-size: 0.9rem;
            }
            .page {
                padding: 90px 16px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-brand">
            <i class="fas fa-trophy"></i>
            <span>Powered by Sodium IT</span>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="login.html" id="loginNavLink" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="#" id="logoutNavLink" style="display:none;" class="logout-btn" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>
    <section class="page" id="page-competition">
        <div class="comp-header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <div class="comp-logo" aria-label="Graphics Designing Logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </div>
            <h1>Graphics Designing</h1>
        </div>
        <div class="comp-sections">
            <div class="section-card">
                <div class="section-title"><i class="fas fa-bullhorn"></i> Announcements</div>
                <div id="compAnnouncements"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>
            </div>
            <div class="section-card">
                <div class="section-title"><i class="fas fa-users"></i> Participants</div>
                <div id="compParticipants"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>
            </div>
        </div>
    </section>
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const COMP_ID = 'graphics-design';
        let toastTimeout = null;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.className = 'toast ' + type;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.querySelector('i').className = 'fas ' + (icons[type] || icons.info);
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function logoutUser(e) {
            if (e) e.preventDefault();
            auth.signOut().then(() => { showToast('Logged out', 'success');
                window.location.href = 'index.html'; }).catch(err => showToast('Logout error: ' + err.message,
                'error'));
        }
        auth.onAuthStateChanged(user => {
            const loginLink = document.getElementById('loginNavLink');
            const logoutLink = document.getElementById('logoutNavLink');
            if (user) { loginLink.style.display = 'none';
                logoutLink.style.display = 'inline-flex'; } else { loginLink.style.display = 'inline-flex';
                logoutLink.style.display = 'none'; }
        });

        async function loadCompetitionData() {
            const annContainer = document.getElementById('compAnnouncements');
            const partContainer = document.getElementById('compParticipants');
            try {
                const doc = await db.collection('competitions').doc(COMP_ID).get();
                const data = doc.exists ? doc.data() : { announcements: [], participants: [] };
                const anns = data.announcements || [];
                if (anns.length === 0) { annContainer.innerHTML =
                        '<div class="empty-state"><i class="fas fa-inbox"></i> No announcements yet</div>'; } else {
                    annContainer.innerHTML = anns.map(a =>
                        `<div class="announcement-item"><div class="title">${escapeHtml(a.title || 'Untitled')}</div><div class="date"><i class="far fa-calendar-alt"></i> ${escapeHtml(a.date || '')}</div><div class="content">${escapeHtml(a.content || '')}</div></div>`
                        ).join('');
                }
                const parts = data.participants || [];
                if (parts.length === 0) { partContainer.innerHTML =
                        '<div class="empty-state"><i class="fas fa-user-plus"></i> No participants yet</div>'; } else {
                    partContainer.innerHTML = parts.map(p => {
                        const members = p.members || [];
                        const memberNames = members.map(m => m.name).filter(Boolean);
                        const displayName = p.projectName || 'Untitled Project';
                        const memberList = memberNames.length > 0 ? memberNames.join(', ') : 'No members added';
                        const memberBadge = `${memberNames.length} member${memberNames.length !== 1 ? 's' : ''}`;
                        return `<div class="participant-item"><div><div class="name">${escapeHtml(displayName)}</div><div class="school">👥 ${escapeHtml(memberList)}</div></div><span class="team-tag"><i class="fas fa-users"></i> ${escapeHtml(memberBadge)}</span></div>`;
                    }).join('');
                }
            } catch (err) {
                console.error('Load error:', err);
                annContainer.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Failed to load</div>`;
                partContainer.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Failed to load</div>`;
                showToast('Failed to load data', 'error');
            }
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div');
            div.textContent = text; return div.innerHTML; }

        window.addEventListener('scroll', () => { const navbar = document.getElementById('navbar'); if (window.scrollY >
                50) navbar.classList.add('scrolled'); else navbar.classList.remove('scrolled'); });
        document.getElementById('navToggle').addEventListener('click', () => { document.getElementById('navLinks')
                .classList.toggle('open'); });
        loadCompetitionData();
    </script>
</body>
</html>
