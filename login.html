<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · CompHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 20%, #1a0b2e 0%, #0d0518 50%, #1a0b2e 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(2px 2px at 20% 30%, rgba(139, 92, 246, 0.5), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(236, 72, 153, 0.4), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(139, 92, 246, 0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(236, 72, 153, 0.5), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(139, 92, 246, 0.4), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(236, 72, 153, 0.3), transparent);
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            animation: sparkle 8s linear infinite;
        }

        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(20px, -20px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(236, 72, 153, 0.12);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.10);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, 20px) scale(1.05);
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 40px 36px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-container .login-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-container h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-container p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .login-container .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .login-container .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }

        .login-container .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .login-container .form-group input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .login-container .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .login-btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.35);
        }

        .login-btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 24px;
        }

        .login-success {
            color: #34d399;
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 24px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #8B5CF6;
        }

        .back-link i {
            margin-right: 6px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(13, 5, 24, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid #34d399;
        }
        .toast.error {
            border-left: 4px solid #f87171;
        }
        .toast.info {
            border-left: 4px solid #8B5CF6;
        }

        .toast i {
            font-size: 1.2rem;
        }
        .toast.success i {
            color: #34d399;
        }
        .toast.error i {
            color: #f87171;
        }
        .toast.info i {
            color: #8B5CF6;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .login-container h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div class="login-container glass">
        <div class="login-icon"><i class="fas fa-shield-alt"></i></div>
        <h2>Admin Login</h2>
        <p>Enter your credentials to access the admin panel</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail"><i class="far fa-envelope"></i> Email</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com" value="" required />
            </div>
            <div class="form-group">
                <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="" value="" required />
            </div>
            <button type="submit" class="login-btn-submit" id="loginSubmitBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
            <div id="loginMessage" class="login-error"></div>
        </form>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <!-- ============================================================ -->
    <!--  FIREBASE SCRIPTS                                             -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <!-- ============================================================ -->
    <!--  FIREBASE CONFIG (EMBEDDED – NO EXTERNAL FILE NEEDED)         -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  FIREBASE CONFIGURATION – Your real credentials
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAEeFkvDRJej6423g0sK131z9OlNXid72U",
            authDomain: "inter-school-competion.firebaseapp.com",
            projectId: "inter-school-competion",
            storageBucket: "inter-school-competion.firebasestorage.app",
            messagingSenderId: "864837384571",
            appId: "1:864837384571:web:7347b91ef44abedb1da5de",
            measurementId: "G-25YH2Z1QYM"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Initialize services (global variables)
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable offline persistence
        db.enablePersistence({ synchronizeTabs: true })
            .catch((err) => {
                console.warn('Firestore persistence error:', err);
            });

        console.log('✅ Firebase initialized successfully (login.html)');
    </script>

    <!-- ============================================================ -->
    <!--  LOGIN LOGIC                                                  -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  TOAST HELPER
        // ============================================================
        let toastTimeout = null;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.className = 'toast ' + type;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.querySelector('i').className = 'fas ' + (icons[type] || icons.info);
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        //  LOGIN HANDLER
        // ============================================================
        function handleLogin(e) {
            e.preventDefault();

            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const msgEl = document.getElementById('loginMessage');

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Clear previous messages
            msgEl.textContent = '';
            msgEl.className = 'login-error';

            // Basic validation
            if (!email || !password) {
                msgEl.textContent = 'Please enter both email and password.';
                return;
            }

            // Disable button & show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            // Attempt sign in
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Success
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    msgEl.className = 'login-success';
                    msgEl.textContent = '✅ Login successful! Redirecting...';
                    showToast('Welcome Admin!', 'success');

                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 800);
                })
                .catch((error) => {
                    // Failure
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    msgEl.className = 'login-error';

                    // User-friendly error messages
                    let userFriendlyMsg = 'Invalid email or password.';
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        userFriendlyMsg = 'Invalid email or password.';
                    } else if (error.code === 'auth/too-many-requests') {
                        userFriendlyMsg = 'Too many failed attempts. Please try again later.';
                    } else if (error.code === 'auth/invalid-email') {
                        userFriendlyMsg = 'Please enter a valid email address.';
                    } else {
                        userFriendlyMsg = 'Login failed. Please check your credentials.';
                        console.warn('Login error code:', error.code);
                    }

                    msgEl.textContent = userFriendlyMsg;
                    showToast(userFriendlyMsg, 'error');
                });
        }

        // ============================================================
        //  AUTO-REDIRECT IF ALREADY LOGGED IN
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Already authenticated -> send to admin page
                window.location.href = 'admin.html';
            }
        });

        console.log('✅ Login page ready');
    </script>

</body>
</html>
